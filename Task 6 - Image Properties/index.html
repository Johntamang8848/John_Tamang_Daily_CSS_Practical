<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 6 — Image Properties</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header><p class="eyebrow">Task 6 · CSS Fundamentals</p><h1>Image Properties</h1><p>These images use different sizes, crops, shapes, and opacity to compare common CSS image properties.</p></header>
    <section class="gallery" aria-label="Image property examples">
      <figure class="image-card"><img class="natural" src="../assets/racing-art.jpeg" alt="Illustrated racing driver standing in front of a race car"><figcaption><strong>Natural proportions</strong><span>width: 100%; height: auto</span></figcaption></figure>
      <figure class="image-card"><img class="cover" src="../assets/guitar-room.jpeg" alt="Acoustic guitar hanging in a sunlit room"><figcaption><strong>Object fit: cover</strong><span>The fixed frame crops the image to fill.</span></figcaption></figure>
      <figure class="image-card"><img class="contain" src="../assets/football-art.jpeg" alt="Illustration of a footballer in Argentina colors"><figcaption><strong>Object fit: contain</strong><span>The complete image stays visible.</span></figcaption></figure>
      <figure class="image-card"><img class="soft" src="../assets/guitar-cat.jpeg" alt="Kitten sitting beside an acoustic guitar"><figcaption><strong>Opacity and shadow</strong><span>A softer image with rounded corners.</span></figcaption></figure>
    </section>
  </main>
</body>
</html>
